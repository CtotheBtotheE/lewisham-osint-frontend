<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lewisham Live — Crime Map</title>
  <meta name="description" content="Real-time crime map for Lewisham, South East London. Live police data from data.police.uk." />
  <meta name="keywords" content="Lewisham crime, Lewisham crime map, SE London safety, Lewisham police" />
  <meta property="og:title" content="Lewisham Live — Crime Map" />
  <meta property="og:description" content="Live crime map for Lewisham, London. Police data updated regularly." />
  <meta property="og:url" content="https://lewishamlive.co.uk" />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://lewishamlive.co.uk" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3985328738392525"
     crossorigin="anonymous"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      min-height: 100vh;
    }

    header {
      background: #1a1d2e;
      border-bottom: 1px solid #2d3148;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    header h1 { font-size: 18px; font-weight: 600; color: #fff; letter-spacing: -0.3px; }
    header p { font-size: 12px; color: #64748b; margin-top: 2px; }

    .live-badge {
      display: flex; align-items: center; gap: 7px; font-size: 12px;
      color: #4ade80; background: rgba(74,222,128,0.1);
      border: 1px solid rgba(74,222,128,0.2); border-radius: 20px; padding: 5px 12px;
    }

    .pulse-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: #4ade80; animation: pulse 1.4s infinite;
    }

    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.2} }

    .container { max-width: 1400px; margin: 0 auto; padding: 20px 24px; }

    .metrics {
      display: grid; grid-template-columns: repeat(3, 1fr);
      gap: 12px; margin-bottom: 20px;
    }

    .metric {
      background: #1a1d2e; border: 1px solid #2d3148;
      border-radius: 10px; padding: 14px 16px;
    }

    .metric-label { font-size: 11px; color: #64748b; text-transform: uppercase; letter-spacing: 0.05em; }
    .metric-value { font-size: 26px; font-weight: 700; color: #fff; margin: 4px 0 2px; line-height: 1; }
    .metric-sub { font-size: 11px; color: #475569; }

    .card {
      background: #1a1d2e; border: 1px solid #2d3148;
      border-radius: 10px; overflow: hidden;
    }

    .card-header {
      padding: 12px 16px; border-bottom: 1px solid #2d3148;
      display: flex; align-items: center; justify-content: space-between;
    }

    .card-header h2 {
      font-size: 13px; font-weight: 500; color: #94a3b8;
      text-transform: uppercase; letter-spacing: 0.05em;
    }

    #map { height: 550px; width: 100%; }

    .refresh-btn {
      font-size: 11px; padding: 4px 10px; border: 1px solid #2d3148;
      border-radius: 6px; background: transparent; color: #64748b; cursor: pointer;
    }
    .refresh-btn:hover { color: #94a3b8; border-color: #3d4268; }

    .layer-toggles { display: flex; gap: 6px; }
    .layer-btn {
      font-size: 10px; padding: 4px 10px; border-radius: 6px; cursor: pointer;
      font-weight: 600; border: 1px solid; transition: all 0.15s;
    }
    .layer-btn.crime { border-color: #ef4444; color: #f87171; background: rgba(239,68,68,0.15); }
    .layer-btn.crime.off { background: transparent; opacity: 0.4; }
    .layer-btn.live { border-color: #c084fc; color: #c084fc; background: rgba(192,132,252,0.15); }
    .layer-btn.live.off { background: transparent; opacity: 0.4; }

    .live-tooltip {
      background: #1a1d2e; color: #c084fc; border: 1px solid #c084fc;
      border-radius: 4px; font-size: 11px; font-weight: 600;
      padding: 3px 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.5);
    }

    @media (max-width: 900px) {
      .metrics { grid-template-columns: repeat(2, 1fr); }
    }

    .leaflet-container { background: #0f1117 !important; }

    .crime-tooltip {
      background: #1a1d2e; color: #f87171; border: 1px solid #ef4444;
      border-radius: 4px; font-size: 11px; font-weight: 600;
      text-transform: capitalize; padding: 3px 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.5);
    }
    .crime-tooltip::before { border-top-color: #ef4444 !important; }

    /* Dark-themed Leaflet popups */
    .leaflet-popup-content-wrapper {
      background: #1a1d2e !important;
      border: 1px solid #2d3148 !important;
      border-radius: 10px !important;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6) !important;
      color: #e2e8f0 !important;
      padding: 0 !important;
    }
    .leaflet-popup-content { margin: 0 !important; width: auto !important; }
    .leaflet-popup-tip { background: #1a1d2e !important; border: 1px solid #2d3148 !important; }
    .leaflet-popup-close-button {
      color: #64748b !important; font-size: 18px !important;
      top: 6px !important; right: 8px !important;
    }
    .leaflet-popup-close-button:hover { color: #e2e8f0 !important; }
  </style>
</head>
<body>

<header>
  <div>
    <h1>Lewisham Live</h1>
    <p>Live crime data — Lewisham, South East London</p>
  </div>
  <div style="display:flex;gap:10px;align-items:center;">
    <div class="live-badge">
      <span class="pulse-dot"></span>
      Live
    </div>
    <button class="refresh-btn" onclick="loadData()">Refresh</button>
  </div>
</header>

<div class="container">

  <div class="metrics">
    <div class="metric">
      <div class="metric-label">Police incidents</div>
      <div class="metric-value" id="m-police">—</div>
      <div class="metric-sub">Latest month · data.police.uk</div>
    </div>
    <div class="metric">
      <div class="metric-label">Top crime type</div>
      <div class="metric-value" style="font-size:16px;padding-top:5px;" id="m-crime-type">—</div>
      <div class="metric-sub">By frequency this month</div>
    </div>
    <div class="metric">
      <div class="metric-label">Last updated</div>
      <div class="metric-value" style="font-size:16px;padding-top:5px;" id="m-time">—</div>
      <div class="metric-sub">Auto-refresh every 5 min</div>
    </div>
  </div>

  <div class="card">
    <div class="card-header">
      <h2>Crime map — Lewisham borough</h2>
      <div style="display:flex;gap:8px;align-items:center;">
        <div class="layer-toggles">
          <button class="layer-btn crime" id="toggle-crime" onclick="toggleLayer('crime')">Historical Crime</button>
          <button class="layer-btn live" id="toggle-live" onclick="toggleLayer('live')">Live Intel</button>
        </div>
        <span style="font-size:11px;color:#475569;" id="map-count"></span>
      </div>
    </div>
    <div id="map"></div>
  </div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>

  const BASE = 'https://lewisham-osint-backend.onrender.com';
  const LEWISHAM = { lat: 51.4613, lng: -0.0117 };
  let map;
  let crimeLayer, liveLayer;
  let showCrime = true, showLive = true;

  // Area name → approx coordinates for placing live intel dots
  const AREA_COORDS = {
    'lewisham': [51.4613, -0.0117], 'catford': [51.4530, -0.0220], 'brockley': [51.4740, -0.0260],
    'downham': [51.4440, -0.0150], 'blackheath': [51.4680, 0.0020], 'forest hill': [51.4560, -0.0400],
    'new cross': [51.4764, -0.0396], 'sydenham': [51.4275, -0.0536], 'hither green': [51.4720, -0.0050],
    'deptford': [51.4830, -0.0100], 'grove park': [51.4380, 0.0230], 'lee': [51.4520, 0.0150],
    'mottingham': [51.4340, 0.0380], 'lee green': [51.4480, 0.0060], 'bellingham': [51.4460, -0.0320],
  };

  function toggleLayer(layer) {
    if (layer === 'crime') {
      showCrime = !showCrime;
      document.getElementById('toggle-crime').classList.toggle('off', !showCrime);
      if (showCrime) map.addLayer(crimeLayer); else map.removeLayer(crimeLayer);
    } else {
      showLive = !showLive;
      document.getElementById('toggle-live').classList.toggle('off', !showLive);
      if (showLive) map.addLayer(liveLayer); else map.removeLayer(liveLayer);
    }
  }

  function initMap() {
    map = L.map('map', { zoomControl: true, attributionControl: false })
            .setView([LEWISHAM.lat, LEWISHAM.lng], 13);

    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      maxZoom: 19
    }).addTo(map);

    crimeLayer = L.layerGroup().addTo(map);
    liveLayer = L.layerGroup().addTo(map);

    fetch('https://mapit.mysociety.org/area/2492.geojson?simplify_tolerance=0.001')
      .then(r => r.json())
      .then(geojson => {
        L.geoJSON(geojson, {
          style: { color: '#3b82f6', fillColor: '#3b82f6', fillOpacity: 0.06, weight: 2 }
        }).addTo(map).bindPopup('<b>London Borough of Lewisham</b>');
        map.fitBounds(L.geoJSON(geojson).getBounds(), { padding: [20, 20] });
      })
      .catch(() => {
        L.circle([LEWISHAM.lat, LEWISHAM.lng], {
          radius: 3000, color: '#3b82f6', fillColor: '#3b82f6', fillOpacity: 0.05, weight: 1
        }).addTo(map);
      });
  }

  function escHtml(str) {
    const d = document.createElement('div');
    d.textContent = str || '';
    return d.innerHTML;
  }

  function relativeTime(dateStr) {
    if (!dateStr) return '';
    const seconds = Math.floor((Date.now() - new Date(dateStr)) / 1000);
    if (seconds < 60) return seconds + 's ago';
    if (seconds < 3600) return Math.floor(seconds / 60) + 'm ago';
    if (seconds < 86400) return Math.floor(seconds / 3600) + 'h ago';
    return Math.floor(seconds / 86400) + 'd ago';
  }

  function buildPopupHtml(crime, tweets, articles) {
    const category = escHtml((crime.category || '').replace(/-/g, ' '));
    const street = escHtml(crime.street || 'Unknown');
    const outcome = escHtml((crime.outcome || 'Under investigation').replace(/-/g, ' '));
    const month = escHtml(crime.month || '');

    let html = '<div style="width:300px;font-family:-apple-system,BlinkMacSystemFont,\'Segoe UI\',sans-serif;">';

    // Crime header
    html += '<div style="padding:12px 14px;border-bottom:1px solid #2d3148;">';
    html += `<div style="font-size:13px;font-weight:700;color:#f87171;text-transform:capitalize;">${category}</div>`;
    html += `<div style="font-size:12px;color:#cbd5e1;margin-top:3px;text-transform:capitalize;">${street}</div>`;
    html += `<div style="font-size:10px;color:#64748b;margin-top:3px;">${outcome} &middot; ${month}</div>`;
    html += '</div>';

    // Committed intelligence summary (if available)
    if (crime.is_committed && crime.committed_summary) {
      html += '<div style="padding:10px 14px;border-bottom:1px solid #2d3148;">';
      html += '<div style="font-size:10px;color:#c084fc;font-weight:700;letter-spacing:0.05em;margin-bottom:6px;">INTELLIGENCE SUMMARY</div>';
      html += `<div style="font-size:11px;color:#cbd5e1;line-height:1.5;padding:8px 10px;border-left:3px solid #c084fc;background:rgba(192,132,252,0.05);border-radius:0 4px 4px 0;">${escHtml(crime.committed_summary)}</div>`;

      // Committed media
      if (crime.committed_media && crime.committed_media.length > 0) {
        html += '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;">';
        crime.committed_media.forEach(url => {
          if (url) html += `<img src="${escHtml(url)}" style="width:80px;height:60px;object-fit:cover;border-radius:4px;border:1px solid #2d3148;" loading="lazy" alt="Evidence" onerror="this.style.display='none'" />`;
        });
        html += '</div>';
      }

      html += '</div>';
    }

    // Linked tweets
    if (tweets && tweets.length > 0) {
      html += '<div style="padding:10px 14px;border-bottom:1px solid #2d3148;">';
      html += `<div style="font-size:10px;color:#3b82f6;font-weight:700;letter-spacing:0.05em;margin-bottom:6px;">LINKED TWEETS (${tweets.length})</div>`;
      tweets.forEach(t => {
        const tweetText = escHtml((t.text || '').slice(0, 140));
        const username = escHtml(t.author_username || 'unknown');
        const tweetTime = relativeTime(t.created_at);
        const tweetUrl = escHtml(t.tweet_url || '#');

        html += '<div style="margin-bottom:8px;padding-bottom:8px;border-bottom:1px solid #1e2235;">';
        html += `<div style="font-size:10px;color:#64748b;">`;
        html += `<a href="${tweetUrl}" target="_blank" rel="noopener" style="color:#60a5fa;text-decoration:none;font-weight:600;">@${username}</a>`;
        html += ` &middot; ${tweetTime}`;
        if (t.confidence) html += ` &middot; <span style="color:#facc15;">${Math.round(t.confidence * 100)}% match</span>`;
        html += '</div>';
        html += `<div style="font-size:11px;color:#cbd5e1;margin-top:3px;line-height:1.4;">${tweetText}</div>`;

        // Media thumbnail
        if (t.media_urls && t.media_urls.length > 0 && t.media_urls[0]) {
          html += `<img src="${escHtml(t.media_urls[0])}" style="width:100%;border-radius:6px;margin-top:6px;max-height:120px;object-fit:cover;" loading="lazy" alt="Tweet media" onerror="this.style.display='none'" />`;
        }

        // Engagement
        if (t.metrics_likes > 0 || t.metrics_retweets > 0) {
          html += '<div style="font-size:9px;color:#475569;margin-top:4px;">';
          if (t.metrics_likes > 0) html += `${t.metrics_likes} likes`;
          if (t.metrics_likes > 0 && t.metrics_retweets > 0) html += ' &middot; ';
          if (t.metrics_retweets > 0) html += `${t.metrics_retweets} retweets`;
          html += '</div>';
        }

        html += '</div>';
      });
      html += '</div>';
    }

    // Linked articles
    if (articles && articles.length > 0) {
      html += '<div style="padding:10px 14px;">';
      html += `<div style="font-size:10px;color:#4ade80;font-weight:700;letter-spacing:0.05em;margin-bottom:6px;">LINKED NEWS (${articles.length})</div>`;
      articles.forEach(a => {
        const title = escHtml((a.title || '').slice(0, 100));
        const source = escHtml(a.source || 'News');
        const articleUrl = escHtml(a.url || '#');
        const pubDate = a.published_at ? new Date(a.published_at).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }) : '';

        html += '<div style="margin-bottom:6px;">';
        html += `<a href="${articleUrl}" target="_blank" rel="noopener" style="font-size:11px;color:#60a5fa;text-decoration:none;line-height:1.3;display:block;">${title}</a>`;
        html += `<div style="font-size:9px;color:#475569;margin-top:2px;">${source}`;
        if (pubDate) html += ` &middot; ${pubDate}`;
        if (a.confidence) html += ` &middot; <span style="color:#facc15;">${Math.round(a.confidence * 100)}%</span>`;
        html += '</div>';
        html += '</div>';
      });
      html += '</div>';
    }

    // No links
    if ((!tweets || tweets.length === 0) && (!articles || articles.length === 0)) {
      html += '<div style="padding:10px 14px;font-size:10px;color:#475569;text-align:center;">No linked intelligence yet</div>';
    }

    html += '</div>';
    return html;
  }

  async function loadData() {
    document.getElementById('m-time').textContent = new Date().toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit' });

    try {
      const r = await fetch(`${BASE}/api/police`);
      if (!r.ok) throw new Error('Backend unavailable');
      const { data } = await r.json();

      const crimes = data.incidents || [];
      const usedMonth = data.month || 'recent';
      const topCategory = (data.topCategory || 'unknown').replace(/-/g, ' ');

      document.getElementById('m-police').textContent = crimes.length.toLocaleString();
      document.getElementById('m-crime-type').textContent = topCategory;

      const CRIME_COLOR = '#ef4444';
      crimeLayer.clearLayers();

      crimes.forEach(c => {
        const lat = c.lat + (Math.random() - 0.5) * 0.0005;
        const lng = c.lng + (Math.random() - 0.5) * 0.0005;
        const category = (c.category || 'unknown').replace(/-/g, ' ');
        const street = c.street || 'Lewisham';
        const outcome = c.outcome || 'Under investigation';
        const crimeId = c.id;

        const marker = L.circleMarker([lat, lng], {
          radius: 5, fillColor: CRIME_COLOR, color: CRIME_COLOR,
          weight: 0.5, fillOpacity: 0.75
        })
        .bindTooltip(category, { direction: 'top', className: 'crime-tooltip' })
        .bindPopup('<div style="padding:14px;font-size:11px;color:#64748b;">Loading intelligence...</div>', {
          maxWidth: 320,
          minWidth: 280,
          className: 'crime-popup',
        });

        // Lazy-load enriched popup on click
        marker.on('popupopen', async function() {
          if (!crimeId) {
            marker.setPopupContent(buildPopupHtml(
              { category: c.category, street, outcome, month: usedMonth }, [], []
            ));
            return;
          }
          try {
            const resp = await fetch(`${BASE}/api/police/crime/${encodeURIComponent(crimeId)}/links`);
            if (!resp.ok) throw new Error('Failed to load');
            const json = await resp.json();
            const d = json.data || {};
            marker.setPopupContent(buildPopupHtml(
              d.crime || { category: c.category, street, outcome, month: usedMonth },
              d.tweets || [],
              d.articles || []
            ));
          } catch {
            marker.setPopupContent(buildPopupHtml(
              { category: c.category, street, outcome, month: usedMonth }, [], []
            ));
          }
        });

        marker.addTo(crimeLayer);
      });

      document.getElementById('map-count').textContent = crimes.length + ' incidents plotted (' + usedMonth + ')';
    } catch {
      document.getElementById('m-police').textContent = 'N/A';
    }
  }

  async function loadLiveIntel() {
    liveLayer.clearLayers();
    const LIVE_COLOR = '#c084fc';
    let liveCount = 0;

    // Fetch tweets, news, TfL road incidents in parallel
    const [twitterRes, newsRes, roadsRes] = await Promise.allSettled([
      fetch(`${BASE}/api/twitter`).then(r => r.json()),
      fetch(`${BASE}/api/news`).then(r => r.json()),
      fetch(`${BASE}/api/tfl-roads`).then(r => r.json()),
    ]);

    // Plot tweets with area_name
    if (twitterRes.status === 'fulfilled' && twitterRes.value?.data?.tweets) {
      twitterRes.value.data.tweets.forEach(t => {
        const coords = t.lat && t.lng ? [t.lat, t.lng] : (t.area_name && AREA_COORDS[t.area_name]) ? AREA_COORDS[t.area_name] : null;
        if (!coords) return;
        const lat = coords[0] + (Math.random() - 0.5) * 0.002;
        const lng = coords[1] + (Math.random() - 0.5) * 0.002;
        const text = escHtml((t.text || '').slice(0, 150));
        const url = escHtml(t.tweet_url || '#');
        L.circleMarker([lat, lng], { radius: 5, fillColor: LIVE_COLOR, color: LIVE_COLOR, weight: 0.5, fillOpacity: 0.8 })
          .bindTooltip('Tweet: @' + (t.author_username || ''), { direction: 'top', className: 'live-tooltip' })
          .bindPopup(`<div style="width:260px;font-family:-apple-system,sans-serif;padding:12px;">
            <div style="font-size:10px;color:#c084fc;font-weight:700;margin-bottom:4px;">LIVE — TWITTER</div>
            <div style="font-size:10px;color:#64748b;"><a href="${url}" target="_blank" rel="noopener" style="color:#60a5fa;text-decoration:none;font-weight:600;">@${escHtml(t.author_username)}</a> &middot; ${relativeTime(t.created_at)}</div>
            <div style="font-size:11px;color:#cbd5e1;margin-top:4px;line-height:1.4;">${text}</div>
            ${t.media_urls?.[0] ? `<img src="${escHtml(t.media_urls[0])}" style="width:100%;border-radius:4px;margin-top:6px;max-height:100px;object-fit:cover;" onerror="this.style.display='none'" />` : ''}
          </div>`, { maxWidth: 280 })
          .addTo(liveLayer);
        liveCount++;
      });
    }

    // Plot news articles with area_name
    if (newsRes.status === 'fulfilled' && newsRes.value?.data?.articles) {
      newsRes.value.data.articles.forEach(a => {
        if (!a.area_name || !AREA_COORDS[a.area_name]) return;
        const coords = AREA_COORDS[a.area_name];
        const lat = coords[0] + (Math.random() - 0.5) * 0.002;
        const lng = coords[1] + (Math.random() - 0.5) * 0.002;
        L.circleMarker([lat, lng], { radius: 4, fillColor: '#4ade80', color: '#4ade80', weight: 0.5, fillOpacity: 0.7 })
          .bindTooltip('News', { direction: 'top', className: 'live-tooltip' })
          .bindPopup(`<div style="width:260px;font-family:-apple-system,sans-serif;padding:12px;">
            <div style="font-size:10px;color:#4ade80;font-weight:700;margin-bottom:4px;">LIVE — NEWS</div>
            <a href="${escHtml(a.url || '#')}" target="_blank" rel="noopener" style="font-size:12px;color:#60a5fa;text-decoration:none;line-height:1.3;">${escHtml((a.title || '').slice(0, 120))}</a>
            <div style="font-size:9px;color:#475569;margin-top:4px;">${escHtml(a.source || '')} &middot; ${relativeTime(a.published)}</div>
          </div>`, { maxWidth: 280 })
          .addTo(liveLayer);
        liveCount++;
      });
    }

    // Plot TfL road disruptions
    if (roadsRes.status === 'fulfilled' && roadsRes.value?.data?.disruptions) {
      roadsRes.value.data.disruptions.forEach(d => {
        // Parse point field "[lng,lat]" or use area from description
        let lat = null, lng = null;
        if (d.point) {
          try { const p = JSON.parse(d.point); lng = p[0]; lat = p[1]; } catch {}
        }
        if (!lat) {
          // Try to find area from location text
          const locLower = (d.location || d.description || '').toLowerCase();
          for (const [area, c] of Object.entries(AREA_COORDS)) {
            if (locLower.includes(area)) { lat = c[0]; lng = c[1]; break; }
          }
        }
        if (!lat) return;
        lat += (Math.random() - 0.5) * 0.001;
        lng += (Math.random() - 0.5) * 0.001;
        const sevColor = d.severity === 'Serious' ? '#ef4444' : d.severity === 'Moderate' ? '#facc15' : '#f97316';
        L.circleMarker([lat, lng], { radius: 6, fillColor: sevColor, color: sevColor, weight: 1, fillOpacity: 0.8 })
          .bindTooltip('Road: ' + (d.severity || ''), { direction: 'top', className: 'live-tooltip' })
          .bindPopup(`<div style="width:260px;font-family:-apple-system,sans-serif;padding:12px;">
            <div style="font-size:10px;color:${sevColor};font-weight:700;margin-bottom:4px;">LIVE — ROAD ${escHtml((d.severity || '').toUpperCase())}</div>
            <div style="font-size:11px;color:#cbd5e1;line-height:1.4;">${escHtml((d.description || '').slice(0, 200))}</div>
            <div style="font-size:9px;color:#475569;margin-top:4px;">${escHtml(d.category || '')} &middot; ${escHtml(d.location || '')}</div>
          </div>`, { maxWidth: 280 })
          .addTo(liveLayer);
        liveCount++;
      });
    }

    const countEl = document.getElementById('map-count');
    const existing = countEl.textContent.split('|')[0].trim();
    countEl.textContent = existing + (liveCount > 0 ? ` | ${liveCount} live intel` : '');
  }

  window.addEventListener('load', () => {
    initMap();
    loadData();
    loadLiveIntel();
    setInterval(loadData, 300000);
    setInterval(loadLiveIntel, 300000);
  });

</script>
</body>
</html>
