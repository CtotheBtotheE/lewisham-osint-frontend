<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lewisham Live — Crime Map</title>
  <meta name="description" content="Real-time crime map for Lewisham, South East London. Live police data from data.police.uk." />
  <meta name="keywords" content="Lewisham crime, Lewisham crime map, SE London safety, Lewisham police" />
  <meta property="og:title" content="Lewisham Live — Crime Map" />
  <meta property="og:description" content="Live crime map for Lewisham, London. Police data updated regularly." />
  <meta property="og:url" content="https://lewishamlive.co.uk" />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://lewishamlive.co.uk" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3985328738392525"
     crossorigin="anonymous"></script>
  <style>
    :root {
      --bg-base: #0f1117; --bg-card: #1a1d2e; --bg-card-hover: #1e2235;
      --border: #2d3148; --border-focus: #3b82f6;
      --text-primary: #e2e8f0; --text-secondary: #94a3b8; --text-muted: #475569;
      --accent-blue: #3b82f6; --sev-critical: #ef4444; --sev-major: #f97316; --sev-minor: #facc15; --sev-info: #60a5fa;
      --success: #4ade80; --danger: #ef4444;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.3); --shadow-md: 0 4px 12px rgba(0,0,0,0.4);
      --radius-sm: 6px; --radius-md: 8px; --radius-lg: 10px;
      --space-xs: 4px; --space-sm: 8px; --space-md: 16px; --space-lg: 24px; --space-xl: 32px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg-base);
      color: var(--text-primary);
      min-height: 100vh;
    }

    /* ---------- Header ---------- */
    header {
      background: var(--bg-card);
      border-bottom: 1px solid var(--border);
      padding: 0 var(--space-lg);
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .header-left { display: flex; align-items: baseline; gap: var(--space-sm); }
    header h1 { font-size: 17px; font-weight: 600; color: #fff; letter-spacing: -0.3px; }
    .header-tagline {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 400;
      letter-spacing: 0.02em;
    }

    .header-right { display: flex; gap: 10px; align-items: center; }

    .live-badge {
      display: flex; align-items: center; gap: 7px; font-size: 12px;
      color: var(--success); background: rgba(74,222,128,0.1);
      border: 1px solid rgba(74,222,128,0.2); border-radius: 20px; padding: 5px 12px;
    }

    .pulse-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--success); animation: pulse 1.4s infinite;
    }

    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.2} }

    /* ---------- Layout ---------- */
    .container { max-width: 1400px; margin: 0 auto; padding: var(--space-md) var(--space-lg); }

    /* ---------- Metrics ---------- */
    .metrics {
      display: grid; grid-template-columns: repeat(3, 1fr);
      gap: 12px; margin-bottom: var(--space-md);
    }

    .metric {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: var(--radius-lg); padding: 14px 16px;
      box-shadow: var(--shadow-sm);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .metric:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }

    .metric-label {
      font-size: 11px; color: var(--text-muted); text-transform: uppercase;
      letter-spacing: 0.05em; display: flex; align-items: center; gap: 5px;
    }
    .metric-label .icon { font-size: 13px; }
    .metric-value { font-size: 26px; font-weight: 700; color: #fff; margin: 4px 0 2px; line-height: 1; }
    .metric-sub { font-size: 11px; color: var(--text-muted); }

    /* ---------- Card ---------- */
    .card {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: var(--radius-lg); overflow: hidden;
    }

    .card-header {
      padding: 10px 16px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
    }

    .card-header h2 {
      font-size: 13px; font-weight: 500; color: var(--text-secondary);
      text-transform: uppercase; letter-spacing: 0.05em;
    }

    /* ---------- Map ---------- */
    #map { height: calc(100vh - 220px); width: 100%; position: relative; }

    .map-legend {
      position: absolute; bottom: 16px; left: 16px; z-index: 800;
      background: rgba(26,29,46,0.92); border: 1px solid var(--border);
      border-radius: var(--radius-md); padding: 8px 12px;
      display: flex; align-items: center; gap: 8px;
      font-size: 11px; color: var(--text-secondary);
      backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
      pointer-events: none;
    }
    .map-legend .legend-dot {
      width: 10px; height: 10px; border-radius: 50%;
      background: var(--sev-critical);
      box-shadow: 0 0 6px rgba(239,68,68,0.5);
      flex-shrink: 0;
    }

    /* ---------- Buttons ---------- */
    .refresh-btn {
      font-size: 11px; padding: 4px 10px; border: 1px solid var(--border);
      border-radius: var(--radius-sm); background: transparent; color: var(--text-muted); cursor: pointer;
      transition: color 0.15s, border-color 0.15s;
    }
    .refresh-btn:hover { color: var(--text-secondary); border-color: #3d4268; }
    .refresh-btn:focus-visible {
      outline: 2px solid var(--border-focus); outline-offset: 2px;
    }

    /* ---------- Layer toggles (pill style) ---------- */
    .layer-toggles { display: flex; gap: 6px; }
    .layer-btn {
      font-size: 10px; padding: 5px 14px; border-radius: 20px; cursor: pointer;
      font-weight: 600; border: 1px solid; transition: all 0.2s ease;
    }
    .layer-btn:focus-visible {
      outline: 2px solid var(--border-focus); outline-offset: 2px;
    }
    .layer-btn.crime {
      border-color: var(--sev-critical); color: #fff;
      background: var(--sev-critical);
    }
    .layer-btn.crime.off {
      background: transparent; color: #f87171; opacity: 0.5;
    }

    /* ---------- Leaflet overrides ---------- */
    .leaflet-container { background: var(--bg-base) !important; }

    /* Zoom controls */
    .leaflet-control-zoom { border: 1px solid var(--border) !important; border-radius: var(--radius-md) !important; overflow: hidden; }
    .leaflet-control-zoom a {
      background: var(--bg-card) !important; color: var(--text-secondary) !important;
      border-bottom: 1px solid var(--border) !important;
      width: 30px !important; height: 30px !important; line-height: 30px !important;
      font-size: 15px !important;
      transition: background 0.15s, color 0.15s;
    }
    .leaflet-control-zoom a:hover {
      background: var(--bg-card-hover) !important; color: #fff !important;
    }
    .leaflet-control-zoom a:last-child { border-bottom: none !important; }

    /* Attribution */
    .leaflet-control-attribution {
      background: rgba(15,17,23,0.7) !important;
      color: var(--text-muted) !important; font-size: 9px !important;
      padding: 2px 6px !important; border-radius: var(--radius-sm) 0 0 0 !important;
    }
    .leaflet-control-attribution a { color: var(--text-muted) !important; }

    /* ---------- Crime tooltip ---------- */
    .crime-tooltip {
      background: var(--bg-card); color: #f87171; border: 1px solid var(--sev-critical);
      border-radius: 4px; font-size: 11px; font-weight: 600;
      text-transform: capitalize; padding: 3px 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.5);
    }
    .crime-tooltip::before { border-top-color: var(--sev-critical) !important; }

    /* ---------- Popup ---------- */
    .leaflet-popup-content-wrapper {
      background: var(--bg-card) !important;
      border: 1px solid var(--border) !important;
      border-radius: var(--radius-lg) !important;
      box-shadow: 0 8px 30px rgba(0,0,0,0.6) !important;
      color: var(--text-primary) !important;
      padding: 0 !important;
    }
    .leaflet-popup-content { margin: 0 !important; width: auto !important; max-width: 350px; }
    .leaflet-popup-tip { background: var(--bg-card) !important; border: 1px solid var(--border) !important; }
    .leaflet-popup-close-button {
      color: var(--text-muted) !important; font-size: 20px !important;
      top: 8px !important; right: 10px !important;
      width: 24px !important; height: 24px !important;
      display: flex !important; align-items: center; justify-content: center;
      border-radius: var(--radius-sm) !important;
      transition: background 0.15s, color 0.15s;
    }
    .leaflet-popup-close-button:hover {
      color: #fff !important;
      background: rgba(255,255,255,0.08) !important;
    }

    /* Crime marker glow */
    .leaflet-interactive[fill="#ef4444"] {
      filter: drop-shadow(0 0 4px rgba(239,68,68,0.45));
    }

    /* ---------- Loading state for popups ---------- */
    .popup-loading {
      display: flex; align-items: center; gap: 8px;
      padding: 16px; font-size: 12px; color: var(--text-muted);
    }
    .popup-loading-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--accent-blue);
      animation: popupPulse 1s ease-in-out infinite;
    }
    .popup-loading-dot:nth-child(2) { animation-delay: 0.15s; }
    .popup-loading-dot:nth-child(3) { animation-delay: 0.3s; }
    @keyframes popupPulse { 0%,100%{opacity:0.3;transform:scale(0.85)} 50%{opacity:1;transform:scale(1)} }

    /* ---------- Responsive ---------- */
    @media (max-width: 768px) {
      .metrics { grid-template-columns: repeat(2, 1fr); }
      #map { height: 400px; }
      .header-tagline { display: none; }
      .leaflet-popup-content { max-width: 300px; }
    }

    @media (max-width: 480px) {
      .metrics { grid-template-columns: 1fr; }
      #map { height: 300px; }
      header { padding: 0 var(--space-md); }
      .container { padding: var(--space-sm) var(--space-md); }
      .leaflet-popup-content { max-width: calc(100vw - 48px); }
      .card-header { flex-direction: column; align-items: flex-start; gap: var(--space-sm); }
    }
  </style>
</head>
<body>

<header>
  <div class="header-left">
    <h1>Lewisham Live</h1>
    <span class="header-tagline">Real-time crime intelligence</span>
  </div>
  <div class="header-right">
    <div class="live-badge">
      <span class="pulse-dot"></span>
      Live
    </div>
    <button class="refresh-btn" onclick="loadData()">Refresh</button>
  </div>
</header>

<div class="container">

  <div class="metrics">
    <div class="metric">
      <div class="metric-label"><span class="icon">&#x1F6E1;</span> Police incidents</div>
      <div class="metric-value" id="m-police">&mdash;</div>
      <div class="metric-sub">Latest month &middot; data.police.uk</div>
    </div>
    <div class="metric">
      <div class="metric-label"><span class="icon">&#x1F4CA;</span> Top crime type</div>
      <div class="metric-value" style="font-size:16px;padding-top:5px;" id="m-crime-type">&mdash;</div>
      <div class="metric-sub">By frequency this month</div>
    </div>
    <div class="metric">
      <div class="metric-label"><span class="icon">&#x1F552;</span> Last updated</div>
      <div class="metric-value" style="font-size:16px;padding-top:5px;" id="m-time">&mdash;</div>
      <div class="metric-sub">Auto-refresh every 5 min</div>
    </div>
  </div>

  <div class="card">
    <div class="card-header">
      <h2>Crime map &mdash; Lewisham borough</h2>
      <div style="display:flex;gap:8px;align-items:center;">
        <div class="layer-toggles">
          <button class="layer-btn crime" id="toggle-crime" onclick="toggleLayer('crime')">Historical Crime</button>
        </div>
        <span style="font-size:11px;color:#475569;" id="map-count"></span>
      </div>
    </div>
    <div style="position:relative;">
      <div id="map"></div>
      <div class="map-legend">
        <span class="legend-dot"></span>
        Crime incident
      </div>
    </div>
  </div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>

  const BASE = 'https://lewisham-osint-backend.onrender.com';
  const LEWISHAM = { lat: 51.4613, lng: -0.0117 };
  let map;
  let crimeLayer;
  let showCrime = true;

  function toggleLayer(layer) {
    if (layer === 'crime') {
      showCrime = !showCrime;
      document.getElementById('toggle-crime').classList.toggle('off', !showCrime);
      if (showCrime) map.addLayer(crimeLayer); else map.removeLayer(crimeLayer);
    }
  }

  function initMap() {
    map = L.map('map', { zoomControl: true, attributionControl: false })
            .setView([LEWISHAM.lat, LEWISHAM.lng], 13);

    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      maxZoom: 19
    }).addTo(map);

    crimeLayer = L.layerGroup().addTo(map);

    fetch('https://mapit.mysociety.org/area/2492.geojson?simplify_tolerance=0.001')
      .then(r => r.json())
      .then(geojson => {
        L.geoJSON(geojson, {
          style: { color: '#3b82f6', fillColor: '#3b82f6', fillOpacity: 0.06, weight: 2 }
        }).addTo(map).bindPopup('<b>London Borough of Lewisham</b>');
        map.fitBounds(L.geoJSON(geojson).getBounds(), { padding: [20, 20] });
      })
      .catch(() => {
        L.circle([LEWISHAM.lat, LEWISHAM.lng], {
          radius: 3000, color: '#3b82f6', fillColor: '#3b82f6', fillOpacity: 0.05, weight: 1
        }).addTo(map);
      });
  }

  function escHtml(str) {
    const d = document.createElement('div');
    d.textContent = str || '';
    return d.innerHTML;
  }

  function relativeTime(dateStr) {
    if (!dateStr) return '';
    const seconds = Math.floor((Date.now() - new Date(dateStr)) / 1000);
    if (seconds < 60) return seconds + 's ago';
    if (seconds < 3600) return Math.floor(seconds / 60) + 'm ago';
    if (seconds < 86400) return Math.floor(seconds / 3600) + 'h ago';
    return Math.floor(seconds / 86400) + 'd ago';
  }

  function buildPopupHtml(crime, tweets, articles) {
    const category = escHtml((crime.category || '').replace(/-/g, ' '));
    const street = escHtml(crime.street || 'Unknown');
    const outcome = escHtml((crime.outcome || 'Under investigation').replace(/-/g, ' '));
    const month = escHtml(crime.month || '');

    let html = '<div style="width:340px;font-family:-apple-system,BlinkMacSystemFont,\'Segoe UI\',sans-serif;">';

    // Crime header
    html += '<div style="padding:14px 16px;border-bottom:1px solid #2d3148;">';
    html += `<div style="font-size:13px;font-weight:700;color:#f87171;text-transform:capitalize;">${category}</div>`;
    html += `<div style="font-size:12px;color:#cbd5e1;margin-top:4px;text-transform:capitalize;">${street}</div>`;
    html += `<div style="font-size:10px;color:#64748b;margin-top:4px;">${outcome} &middot; ${month}</div>`;
    html += '</div>';

    // Committed intelligence summary (if available)
    if (crime.is_committed && crime.committed_summary) {
      html += '<div style="padding:12px 16px;border-bottom:1px solid #2d3148;">';
      html += '<div style="font-size:10px;color:#c084fc;font-weight:700;letter-spacing:0.05em;margin-bottom:8px;">INTELLIGENCE SUMMARY</div>';
      html += `<div style="font-size:11px;color:#cbd5e1;line-height:1.5;padding:10px 12px;border-left:3px solid #a855f7;background:rgba(168,85,247,0.06);border-radius:0 6px 6px 0;">${escHtml(crime.committed_summary)}</div>`;

      // Committed media — horizontal scroll
      if (crime.committed_media && crime.committed_media.length > 0) {
        html += '<div style="display:flex;gap:6px;overflow-x:auto;white-space:nowrap;margin-top:10px;padding-bottom:4px;">';
        crime.committed_media.forEach(url => {
          if (url) html += `<img src="${escHtml(url)}" style="width:80px;height:60px;object-fit:cover;border-radius:4px;border:1px solid #2d3148;flex-shrink:0;" loading="lazy" alt="Evidence" onerror="this.style.display='none'" />`;
        });
        html += '</div>';
      }

      html += '</div>';
    }

    // Linked tweets
    if (tweets && tweets.length > 0) {
      html += '<div style="padding:12px 16px;border-bottom:1px solid #2d3148;">';
      html += `<div style="font-size:10px;color:#3b82f6;font-weight:700;letter-spacing:0.05em;margin-bottom:8px;">LINKED TWEETS (${tweets.length})</div>`;
      tweets.forEach(t => {
        const tweetText = escHtml((t.text || '').slice(0, 140));
        const username = escHtml(t.author_username || 'unknown');
        const tweetTime = relativeTime(t.created_at);
        const tweetUrl = escHtml(t.tweet_url || '#');

        html += '<div style="margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid #1e2235;">';
        html += `<div style="font-size:10px;color:#64748b;">`;
        html += `<a href="${tweetUrl}" target="_blank" rel="noopener" style="color:#60a5fa;text-decoration:none;font-weight:600;">@${username}</a>`;
        html += ` &middot; ${tweetTime}`;
        if (t.confidence) html += ` &middot; <span style="color:#facc15;">${Math.round(t.confidence * 100)}% match</span>`;
        html += '</div>';
        html += `<div style="font-size:11px;color:#cbd5e1;margin-top:4px;line-height:1.45;">${tweetText}</div>`;

        // Media thumbnail
        if (t.media_urls && t.media_urls.length > 0 && t.media_urls[0]) {
          html += `<img src="${escHtml(t.media_urls[0])}" style="width:100%;border-radius:6px;margin-top:6px;max-height:120px;object-fit:cover;" loading="lazy" alt="Tweet media" onerror="this.style.display='none'" />`;
        }

        // Engagement
        if (t.metrics_likes > 0 || t.metrics_retweets > 0) {
          html += '<div style="font-size:9px;color:#475569;margin-top:4px;">';
          if (t.metrics_likes > 0) html += `${t.metrics_likes} likes`;
          if (t.metrics_likes > 0 && t.metrics_retweets > 0) html += ' &middot; ';
          if (t.metrics_retweets > 0) html += `${t.metrics_retweets} retweets`;
          html += '</div>';
        }

        html += '</div>';
      });
      html += '</div>';
    }

    // Linked articles
    if (articles && articles.length > 0) {
      html += '<div style="padding:12px 16px;">';
      html += `<div style="font-size:10px;color:#4ade80;font-weight:700;letter-spacing:0.05em;margin-bottom:8px;">LINKED NEWS (${articles.length})</div>`;
      articles.forEach(a => {
        const title = escHtml((a.title || '').slice(0, 100));
        const source = escHtml(a.source || 'News');
        const articleUrl = escHtml(a.url || '#');
        const pubDate = a.published_at ? new Date(a.published_at).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }) : '';

        html += '<div style="margin-bottom:8px;">';
        html += `<a href="${articleUrl}" target="_blank" rel="noopener" style="font-size:11px;color:#60a5fa;text-decoration:none;line-height:1.3;display:block;">${title}</a>`;
        html += `<div style="font-size:9px;color:#475569;margin-top:2px;">${source}`;
        if (pubDate) html += ` &middot; ${pubDate}`;
        if (a.confidence) html += ` &middot; <span style="color:#facc15;">${Math.round(a.confidence * 100)}%</span>`;
        html += '</div>';
        html += '</div>';
      });
      html += '</div>';
    }

    // No links
    if ((!tweets || tweets.length === 0) && (!articles || articles.length === 0)) {
      html += '<div style="padding:12px 16px;font-size:11px;color:#475569;text-align:center;">No linked intelligence yet</div>';
    }

    html += '</div>';
    return html;
  }

  async function loadData() {
    document.getElementById('m-time').textContent = new Date().toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit' });

    try {
      const r = await fetch(`${BASE}/api/police`);
      if (!r.ok) throw new Error('Backend unavailable');
      const { data } = await r.json();

      const crimes = data.incidents || [];
      const usedMonth = data.month || 'recent';
      const topCategory = (data.topCategory || 'unknown').replace(/-/g, ' ');

      document.getElementById('m-police').textContent = crimes.length.toLocaleString();
      document.getElementById('m-crime-type').textContent = topCategory;

      const CRIME_COLOR = '#ef4444';
      crimeLayer.clearLayers();

      crimes.forEach(c => {
        const lat = c.lat + (Math.random() - 0.5) * 0.0005;
        const lng = c.lng + (Math.random() - 0.5) * 0.0005;
        const category = (c.category || 'unknown').replace(/-/g, ' ');
        const street = c.street || 'Lewisham';
        const outcome = c.outcome || 'Under investigation';
        const crimeId = c.id;

        const marker = L.circleMarker([lat, lng], {
          radius: 5, fillColor: CRIME_COLOR, color: CRIME_COLOR,
          weight: 0.5, fillOpacity: 0.75
        })
        .bindTooltip(category, { direction: 'top', className: 'crime-tooltip' })
        .bindPopup('<div class="popup-loading"><span class="popup-loading-dot"></span><span class="popup-loading-dot"></span><span class="popup-loading-dot"></span>Loading details...</div>', {
          maxWidth: 360,
          minWidth: 300,
          className: 'crime-popup',
        });

        // Lazy-load enriched popup on click
        marker.on('popupopen', async function() {
          if (!crimeId) {
            marker.setPopupContent(buildPopupHtml(
              { category: c.category, street, outcome, month: usedMonth }, [], []
            ));
            return;
          }
          try {
            const resp = await fetch(`${BASE}/api/police/crime/${encodeURIComponent(crimeId)}/links`);
            if (!resp.ok) throw new Error('Failed to load');
            const json = await resp.json();
            const d = json.data || {};
            marker.setPopupContent(buildPopupHtml(
              d.crime || { category: c.category, street, outcome, month: usedMonth },
              d.tweets || [],
              d.articles || []
            ));
          } catch {
            marker.setPopupContent(buildPopupHtml(
              { category: c.category, street, outcome, month: usedMonth }, [], []
            ));
          }
        });

        marker.addTo(crimeLayer);
      });

      document.getElementById('map-count').textContent = crimes.length + ' incidents plotted (' + usedMonth + ')';
    } catch {
      document.getElementById('m-police').textContent = 'N/A';
    }
  }

  window.addEventListener('load', () => {
    initMap();
    loadData();
    setInterval(loadData, 300000);
  });

</script>
